services:
  gh-cron-mcp:
    image: registry.localdomain:5000/gh-cron-mcp:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - PORT=8000
    volumes:
      - gh-cron-mcp-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gh-cron-mcp-data:
